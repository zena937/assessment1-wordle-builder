services:
  # Tier 1: Database
  db:
    image: postgres:15-alpine
    container_name: phoneme_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: phoneme_builder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Tier 2: Application
  app:
    build: .
    container_name: phoneme_app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/phoneme_builder
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./prisma:/app/prisma
    command: >
      sh -c "npx prisma migrate deploy &&
             npm run start"

  # Tier 3: Database Management (Adminer)
  adminer:
    image: adminer
    container_name: phoneme_adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data: